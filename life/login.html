<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>大肥鱼 · B 站与日记</title>
<style>body{margin:0;background:#eff5fb;color:#20334e;font:16px/1.65 'Microsoft YaHei UI',sans-serif}main{max-width:800px;margin:42px auto;padding:30px;background:white;border-radius:20px;box-shadow:0 12px 40px #163e6b12}h1{margin:0 0 5px}p{color:#60738e}button{padding:12px 21px;border:0;border-radius:9px;background:#286fd6;color:white;font:inherit;margin:6px 8px 6px 0;cursor:pointer}button.secondary{background:#e9f1fc;color:#24588d}#qr{width:230px;min-height:230px;margin:18px auto;display:none}#message{white-space:pre-wrap;padding:14px;background:#f3f7fc;border-radius:10px}pre{white-space:pre-wrap;overflow-wrap:anywhere;border-top:1px solid #e3ebf4;padding-top:18px;font:15px/1.8 'Microsoft YaHei UI',sans-serif}.tag{color:#14816d}small{color:#75869e}</style>
<main><h1>大肥鱼的 B 站生活</h1><p>扫码登录你准备好的 B 站小号。登录后先试运行一次，再按北京时间晚间作息活动。</p><div id="status">正在检查…</div><button id="login">生成登录二维码</button><button class="secondary" id="run">现在活动一次</button><button class="secondary" id="diary">查看最近日记</button><img id="qr" alt="用手机哔哩哔哩扫描此二维码"><div id="message">准备就绪后点击“生成登录二维码”。</div><small>第一版读取视频资料、写本地日记；QQ 可以查询这些记录。自主活动开关位于大肥鱼管家中。</small><pre id="memory"></pre></main>
<script>
const el=id=>document.getElementById(id);let challenge=null,polling=false;
async function api(path,data){const r=await fetch('/api/'+path,{method:data?'POST':'GET',headers:data?{'Content-Type':'application/json'}:{},body:data?JSON.stringify(data):undefined});const value=await r.json();if(!r.ok||value.ok===false)throw Error(value.error||'请求失败');return value}
async function status(){try{const s=await api('status');el('status').textContent=(s.loggedIn?'已登录：'+s.account.name:'B 站尚未登录')+'　｜　自主活动：'+(s.enabled?'已开启':'已暂停')+'　｜　日记 '+s.diaryCount+' 篇';el('run').disabled=!s.loggedIn||!s.enabled||s.active}catch{el('status').textContent='连接暂时不可用，请确认 Harness 正在运行。'}}
el('login').onclick=async()=>{try{el('login').disabled=true;const q=await api('qr/start',{});challenge=q.id;el('qr').src=q.image;el('qr').style.display='block';el('message').textContent='请用手机哔哩哔哩扫描二维码，并在手机上确认登录。'}catch(e){el('message').textContent=e.message}finally{el('login').disabled=false}};
setInterval(async()=>{if(!challenge||polling)return;polling=true;try{const q=await api('qr/poll',{id:challenge});if(q.status==='success'){challenge=null;el('qr').style.display='none';el('message').textContent='登录成功：'+q.account.name+'。正在启动首次浏览与日记任务。';await status()}else if(q.status==='scanned')el('message').textContent='已扫描，请在手机上确认登录。';else if(['expired','error','cancelled'].includes(q.status)){challenge=null;el('message').textContent=q.error||'二维码已过期，请重新生成。'}}catch(e){el('message').textContent=e.message}finally{polling=false}},2500);
el('run').onclick=async()=>{try{const r=await api('run',{});el('message').textContent=r.accepted?'活动任务已交给大肥鱼，完成后可查看日记。':'当前活动暂停、未登录或已有任务在运行。';await status()}catch(e){el('message').textContent=e.message}};
el('diary').onclick=async()=>{try{const m=await api('memory');el('memory').textContent=m.diaries.length?m.diaries.map(x=>x.text).join('\n\n'):'还没有日记；登录后完成首次活动即可生成。'}catch(e){el('message').textContent=e.message}};
status();setInterval(status,10000);
</script></html>
